<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore — TasteTrail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="brand">TasteTrail</a>
      <nav class="nav-links" aria-label="Primary">
        <a href="explore.html" class="active">Explore</a>
        <a href="local-finds.html">Local Finds</a>
        <a href="favorites.html">Favorites</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn mobile-only" id="filters-toggle" aria-label="Toggle filters" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
        </button>
        <a href="compare.html" class="icon-btn" aria-label="Compare restaurants">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4"/></svg>
          <span class="compare-badge">0</span>
        </a>
        <a href="profile.html" class="icon-btn" aria-label="Your profile">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-3.6 4.4-5.6 7.5-5.6s6.1 2 7.5 5.6"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main>
    <section class="explore-header">
      <div class="container">
        <h1>Explore</h1>
        <div class="search-bar">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <label for="explore-search" class="visually-hidden">Search restaurants, cuisines or places</label>
          <input type="text" id="explore-search" placeholder="Search restaurants, cuisines or places...">
        </div>
      </div>
    </section>

    <section class="container">
      <div class="explore-layout">

        <!-- ============ FILTERS ============ -->
        <aside class="filters-panel" id="filters-panel" aria-label="Filters">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <h2>Filters</h2>
            <button class="btn btn-sm btn-outline" id="clear-filters">Clear all</button>
          </div>

          <div class="filter-group">
            <span class="filter-title">Cuisine</span>
            <div class="chip-row" id="chips-cuisine"></div>
          </div>

          <div class="filter-group">
            <span class="filter-title">Budget</span>
            <div class="chip-row" id="chips-budget"></div>
          </div>

          <div class="filter-group">
            <span class="filter-title">Rating</span>
            <div class="chip-row">
              <button class="chip" data-min-rating="4">4.0+</button>
              <button class="chip" data-min-rating="4.5">4.5+</button>
              <button class="chip" data-min-rating="3">3.0+</button>
            </div>
          </div>

          <div class="filter-group">
            <span class="filter-title">Distance — <span id="distance-label">10 km</span></span>
            <input type="range" id="filter-distance" min="0.5" max="10" step="0.5" value="10">
          </div>

          <div class="filter-group">
            <label class="checkbox-row">
              <input type="checkbox" id="filter-open-now">
              Open now
            </label>
          </div>

          <div class="filter-group">
            <span class="filter-title">Dietary</span>
            <div class="chip-row" id="chips-dietary"></div>
          </div>

          <div class="filter-group">
            <span class="filter-title">Facilities</span>
            <div class="chip-row" id="chips-facility"></div>
          </div>

          <div class="filter-group">
            <span class="filter-title">Dining Purpose</span>
            <div class="chip-row" id="chips-purpose"></div>
          </div>

          <div class="filter-group">
            <span class="filter-title">Category</span>
            <div class="chip-row" id="chips-category"></div>
          </div>
        </aside>

        <!-- ============ RESULTS + MAP ============ -->
        <div>
          <div class="results-header">
            <span class="results-count" id="results-count"></span>
            <div class="sort-field">
              <label for="sort-select">Sort by</label>
              <select class="select" id="sort-select">
                <option value="relevance">Relevance</option>
                <option value="rating">Rating</option>
                <option value="distance">Distance</option>
                <option value="price">Price</option>
                <option value="popularity">Popularity</option>
              </select>
            </div>
          </div>

          <div class="explore-split">
            <div class="results-list" id="results-list"></div>
            <div class="map-panel explore-map-panel" id="explore-map"></div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>TasteTrail — a B.Tech CSE academic project.</p>
      <p>Built with HTML, CSS &amp; JavaScript.</p>
    </div>
  </footer>

  <nav class="bottom-nav" aria-label="Mobile">
    <a href="explore.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Explore
    </a>
    <a href="local-finds.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4C10 4 4 10 4 20c10 0 16-6 16-16Z"/><path d="M9 15c3-3 5-5 9-9"/></svg>
      Local Finds
    </a>
    <a href="favorites.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 8.6c0 4.4-8.8 10.4-8.8 10.4S3.2 13 3.2 8.6C3.2 5.6 5.6 3.2 8.6 3.2c1.6 0 3 .7 3.4 1.9.4-1.2 1.8-1.9 3.4-1.9 3 0 5.4 2.4 5.4 5.4Z"/></svg>
      Favorites
    </a>
    <a href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-3.6 4.4-5.6 7.5-5.6s6.1 2 7.5 5.6"/></svg>
      Profile
    </a>
  </nav>

  <script src="js/restaurants.js"></script>
  <script src="js/main.js"></script>
  <script src="js/explore.js"></script>
</body>
</html>
